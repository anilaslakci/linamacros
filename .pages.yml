media:
  input: src/assets/images/blog
  output: /assets/images/blog
  rename: safe
  extensions: [png, jpg, jpeg, webp, avif]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content(blog): {filename} eklendi"
      update: "content(blog): {filename} güncellendi"
      delete: "content(blog): {filename} silindi"
      rename: "content(blog): {oldFilename} -> {newFilename}"

content:
  - name: products
    label: Ürünler ve Fiyatlar
    type: file
    path: src/_data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: Ürün Kimliği
        type: select
        required: true
        description: Doğrudan ürün bağlantısı için kullanılan sabit kimlik. Mevcut üründe değiştirmeyin.
        options:
          values: [product-pubg-steam, product-pubg-mobile, product-valorant, product-cs2]
      - name: name
        label: Ürün adı
        type: string
        required: true
      - name: game
        label: İlgili oyun
        type: string
        required: true
        description: Analytics etkinliğinde gönderilen oyun adı.
      - name: cardLabel
        label: Kart üst etiketi
        type: string
        required: true
        description: Kartın sol üstünde görünen kısa oyun adı.
      - name: price
        label: Güncel satış fiyatı (TL)
        type: number
        required: true
        options:
          min: 1
      - name: regularPrice
        label: İndirimsiz / üstü çizili fiyat (TL)
        type: number
        description: İndirim yoksa boş bırakabilirsiniz. Güncel satış fiyatından düşük olamaz.
        options:
          min: 1
      - name: description
        label: Kısa ürün açıklaması
        type: text
        required: true
      - name: shopierUrl
        label: Shopier satın alma bağlantısı
        type: string
        required: true
        description: Ürünün mevcut Shopier bağlantısını yalnızca gerektiğinde değiştirin.
      - name: active
        label: Aktif
        type: boolean
        default: true
  - name: faqs
    label: Sık Sorulan Sorular
    type: file
    path: src/_data/faqs.json
    format: json
    list: true
    fields:
      - name: question
        label: Soru
        type: string
        required: true
      - name: answer
        label: Cevap
        type: text
        required: true
      - name: category
        label: Kategori
        type: string
        required: true
      - name: order
        label: Sıralama
        type: number
        required: true
        options:
          min: 0
      - name: active
        label: Aktif
        type: boolean
        default: true
  - name: posts
    label: Blog Yazıları
    type: collection
    path: src/blog/posts
    format: yaml-frontmatter
    exclude: [posts.11tydata.json]
    filename:
      template: "{primary}.md"
      field: create
    subfolders: false
    operations:
      delete: false
      rename: false
    view:
      fields: [title, category, date, updated]
      primary: title
      sort: [date, updated, title]
      search: [title, description, category, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        required: true
        description: Arama sonucunda ve makalenin üstünde görünen ana başlık.
        options:
          minlength: 20
          maxlength: 70
      - name: description
        label: Meta açıklaması
        type: text
        required: true
        description: Arama sonuçları ve sosyal paylaşım için 120-160 karakterlik özgün özet.
        options:
          minlength: 120
          maxlength: 160
      - name: date
        label: Yayın tarihi
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Güncelleme tarihi
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Kategori
        type: select
        required: true
        options:
          values: [PUBG, Valorant, CS2, Oyun Rehberi, Teknik Rehber]
      - name: readingTime
        label: Tahmini okuma süresi
        type: number
        required: true
        description: Dakika cinsinden tam sayı.
        options:
          min: 2
          max: 30
      - name: tags
        label: Anahtar konular
        type: string
        list: true
        required: true
      - name: body
        label: Makale içeriği
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
          switcher: true
